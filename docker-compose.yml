services:
  backend:
    build: ./backend
    container_name: familyfinance-backend
    restart: unless-stopped
    environment:
      - TZ=Europe/Zurich
      - JWT_SECRET=bitte-aendern-langer-zufaelliger-string
      - PORT=3001
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      - BACKUP_PATH=/app/backups
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    expose:
      - "3001"

  frontend:
    build: ./frontend
    container_name: familyfinance-frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: familyfinance-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
